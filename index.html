<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>パークさんぽガイド（仮）</title>

  <!-- ホーム画面に追加したときの名前・アイコン・色（PWA） -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1f2333">
  <link rel="icon" href="icons/icon-192.png">
  <!-- iPhone用：ホーム画面のアイコンと、アプリのように全画面で開く設定 -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="さんぽガイド">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- 地図ライブラリ Leaflet の見た目 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <!-- このサイト独自の見た目 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 上のバー：タイトルとモード切り替え -->
  <header class="topbar">
    <div class="title">パークさんぽガイド<span class="tag">試作版</span></div>
    <div class="actions">
      <!-- 地図と一覧の切り替え -->
      <button id="btn-list" class="view-toggle">一覧</button>
      <div class="modes">
        <button id="btn-demo" class="mode active">デモ</button>
        <button id="btn-gps" class="mode">GPS</button>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- 地図がここに表示される -->
    <div id="map"></div>

    <!-- スポット一覧（地図の上に重ねて表示する） -->
    <section id="list" class="list hidden">
      <p id="list-note" class="list-note"></p>
      <ul id="list-items" class="list-items"></ul>
    </section>
  </main>

  <!-- 今の状態（いちばん近いスポットまでの距離など） -->
  <div id="status" class="status">地図をタップすると、そこに「自分」が移動します</div>

  <!-- スポットに近づいたときに出てくるカード -->
  <section id="card" class="card hidden" aria-live="polite">
    <button id="card-close" class="close" aria-label="閉じる">×</button>
    <div class="badges">
      <span id="card-category" class="badge"></span>
      <span id="card-source" class="badge sub"></span>
    </div>
    <h2 id="card-title"></h2>
    <p id="card-body"></p>
    <button id="card-found" class="found hidden">見つけた！</button>
  </section>

  <footer class="notice">非公式ファンサイトです。運営会社とは関係ありません。</footer>

  <!-- 読み込む順番が大事：Leaflet → スポットのデータ → 動きのプログラム -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="spots.js"></script>
  <script src="app.js"></script>
</body>
</html>
